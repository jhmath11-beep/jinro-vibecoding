<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: "Malgun Gothic", sans-serif; background:#F3F6F5; color:#1D2B2A; margin:0; padding:20px 16px }
  main { max-width:720px; margin:0 auto; display:grid; gap:16px }
  form, .rec { background:#fff; border:1px solid #D7E0DE; border-radius:12px; padding:16px; display:grid; gap:8px }
  label { display:grid; gap:4px }
  input, select, textarea, button { font:inherit; padding:8px; border:1px solid #D7E0DE; border-radius:8px }
  button { background:#23756B; color:#fff; border:0; cursor:pointer }
  .tag { font-size:.8rem; background:#E7F1EF; border-radius:4px; padding:1px 8px }
  .muted { color:#5E6E6C; font-size:.9rem }
</style>
</head>
<body>
<main>
  <h1>나의 진로 포트폴리오</h1>
  <p class="muted" id="who">불러오는 중…</p>
  <form id="f">
    <label>날짜 <input type="date" id="date" required></label>
    <label>영역 <select id="area"></select></label>
    <label>활동명 <input id="title" placeholder="예) 진로 체험의 날 - 병원 견학" required></label>
    <label>배운 점 <textarea id="learned" rows="3"></textarea></label>
    <label>내 진로와 어떻게 연결될까? <textarea id="link" rows="2"></textarea></label>
    <button>기록 추가</button>
    <span class="muted" id="msg"></span>
  </form>
  <h2>내 기록 <span class="muted" id="count"></span></h2>
  <div id="list"></div>
</main>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  $('date').value = today();
  function show(records) {
    $('count').textContent = `(${records.length}개)`;
    $('list').innerHTML = records.map(r => `<div class="rec"><span><span class="tag">${esc(r.area)}</span> ${esc(r.date)}</span>
      <b>${esc(r.title)}</b><span>${esc(r.learned)}</span><span class="muted">→ ${esc(r.link)}</span></div>`).join('') || '<p class="muted">아직 기록이 없어요.</p>';
  }
  const btn = document.querySelector('#f button');
  const fail = e => { $('msg').textContent = e.message; btn.disabled = false; };
  google.script.run.withSuccessHandler(d => {
    $('who').textContent = d.email + ' 계정으로 기록합니다';
    $('area').innerHTML = d.areas.map(a => `<option>${esc(a)}</option>`).join('');
    show(d.records);
  }).withFailureHandler(fail).getInit();
  $('f').onsubmit = e => {
    e.preventDefault();
    $('msg').textContent = '저장 중…';
    btn.disabled = true;
    google.script.run.withSuccessHandler(rs => { show(rs); $('f').reset(); $('date').value = today(); $('msg').textContent = '저장했어요.'; btn.disabled = false; })
      .withFailureHandler(fail)
      .addRecord({ date: $('date').value, area: $('area').value, title: $('title').value, learned: $('learned').value, link: $('link').value });
  };
</script>
</body>
</html>
