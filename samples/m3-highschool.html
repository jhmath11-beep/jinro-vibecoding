<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고등학교 유형 나침반</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Gowun+Batang:wght@700&display=swap">
<style>
  :root { --bg:#F3F6F5; --card:#fff; --ink:#1D2B2A; --muted:#5E6E6C; --line:#D7E0DE; --accent:#23756B; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "IBM Plex Sans KR", sans-serif; padding:24px 16px 48px }
  main { max-width:960px; margin:0 auto; display:grid; gap:18px }
  h1 { font:700 1.8rem "Gowun Batang", serif; margin:0 }
  h2 { margin:0 0 10px; font-size:1.1rem }
  .sub, .muted { color:var(--muted); margin:4px 0 0 }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; min-width:0 }
  .q { display:grid; grid-template-columns:1fr minmax(140px,220px); gap:12px; align-items:center; padding:6px 0 }
  .q input { width:100% }
  .rank { display:grid; gap:10px }
  .item { display:grid; grid-template-columns:2.2em 1fr; gap:4px 12px; align-items:start; padding:12px; border:1px solid var(--line); border-radius:10px }
  .item b.n { font:700 1.4rem "Gowun Batang", serif; color:var(--accent) }
  .meter { grid-column:2; height:6px; background:#E7F1EF; border-radius:3px }
  .meter i { display:block; height:100%; background:var(--accent); border-radius:3px }
  .wrap { overflow-x:auto }
  table { border-collapse:collapse; width:100%; min-width:640px; font-size:.92rem }
  th, td { border-bottom:1px solid var(--line); padding:8px; text-align:left; vertical-align:top }
  th { background:#E7F1EF }
  a { color:var(--accent) }
</style>
</head>
<body>
<main>
  <header>
    <h1>고등학교 유형 나침반</h1>
    <p class="sub">[9진로02-05] 내 생각에 가까운 만큼 막대를 움직이면, 어울릴 만한 고등학교 유형을 순서대로 보여 줍니다.</p>
  </header>
  <section><h2>나는 고등학교에서…</h2><div id="qs"></div></section>
  <section><h2>나에게 어울릴 수 있는 유형</h2><div class="rank" id="rank"></div>
    <p class="muted">순위는 내 선택을 정리해 보는 도구일 뿐, 입학 가능성이나 적합성을 판정하지 않습니다. 학교별 모집 요강·전형은 해마다 달라지므로 반드시 공식 사이트에서 확인하세요.</p>
  </section>
  <section><h2>유형별 한눈에 보기</h2><div class="wrap"><table id="table"></table></div>
    <p class="muted">공식 정보: <a href="https://www.hischool.go.kr" target="_blank" rel="noopener">고입정보포털</a> ·
      <a href="https://www.hscredit.kr" target="_blank" rel="noopener">고교학점제 누리집</a> ·
      <a href="https://www.hifive.go.kr" target="_blank" rel="noopener">특성화고·마이스터고 포털(HiFive)</a></p>
  </section>
</main>
<script>
const Q = [
  '여러 과목을 골고루 배우며 진로를 천천히 정하고 싶다',
  '수학·과학을 깊이 탐구하고 연구하고 싶다',
  '외국어를 깊이 배우거나 국제 문제를 공부하고 싶다',
  '예술이나 체육 실기를 전문적으로 배우고 싶다',
  '졸업 후 바로 취업할 수 있는 기술을 배우고 싶다',
  '학교만의 특색 있는 교육과정을 경험하고 싶다',
];
// [유형, 특징, 이런 학생에게, 확인할 점, 질문별 가중치(0~3)]
const S = [
  ['일반고','공통 과목 뒤 고교학점제로 진로에 맞는 과목을 골라 듣는다. 가장 많은 학생이 다닌다.','진로를 넓게 열어 두고 싶은 학생','학교마다 개설 과목이 다르니 희망 과목 개설 여부를 확인',[3,0,1,0,0,1]],
  ['자율형 공립고','공립이지만 교육과정을 비교적 자율적으로 운영한다.','일반고와 비슷하되 학교 특색 프로그램을 원하는 학생','학교별 특색 프로그램과 지역 배정 방식',[2,1,0,0,0,2]],
  ['자율형 사립고','사립학교가 교육과정·학사 운영을 자율적으로 정한다.','학교의 특색 교육과정과 면학 분위기를 원하는 학생','등록금(일반고보다 높음), 기숙사 여부, 전형 방법',[1,1,1,0,0,3]],
  ['과학고·영재학교','과학고(특수목적고)는 수학·과학 심화 과정과 연구 활동 중심, 영재학교는 영재교육 관련 법에 따라 수학·과학 영재를 대상으로 운영한다.','수학·과학 탐구에 강한 흥미와 의지가 있는 학생','두 학교는 근거 법령과 선발 시기·절차가 다르므로 각각 확인, 기숙사 생활·학업 부담',[0,3,0,0,0,1]],
  ['외국어고·국제고(특수목적고)','외국어 또는 국제 관계·지역 연구 관련 과목을 깊이 배운다.','언어·국제 문제에 흥미가 큰 학생','전공 언어 선택, 전형 방법',[1,0,3,0,0,1]],
  ['예술고·체육고(특수목적고)','예술(음악·미술·무용·연극 등) 또는 체육 분야 전문 교육을 한다.','실기 분야에서 꾸준히 준비해 온 학생','실기 전형, 레슨·훈련 부담',[0,0,0,3,0,1]],
  ['마이스터고(특수목적고)','산업계 수요에 맞춘 직업교육으로 분야별 기술 인재를 기른다.','특정 기술 분야로 빠르게 취업하고 싶은 학생','학교별 분야(반도체·자동차·조리 등), 취업 연계',[0,0,0,0,3,1]],
  ['특성화고','특정 분야의 직업교육과 현장 실습을 중심으로 운영한다.','관심 분야 기술을 익히며 취업·진학을 모두 고민하는 학생','학과 종류, 자격증 과정, 졸업 후 진학 경로',[0,0,0,1,3,1]],
];
const v = Q.map(() => 2);
document.getElementById('qs').innerHTML = Q.map((q, i) =>
  `<div class="q"><label for="r${i}">${q}</label><input type="range" id="r${i}" min="0" max="4" value="2" aria-label="${q}"></div>`).join('');
Q.forEach((_, i) => document.getElementById(`r${i}`).oninput = e => { v[i] = +e.target.value; render(); });

document.getElementById('table').innerHTML = '<tr><th>유형</th><th>특징</th><th>이런 학생에게</th><th>꼭 확인할 점</th></tr>' +
  S.map(s => `<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td></tr>`).join('');

function render() {
  // 유형마다 가중치 합이 달라 최대 점수 대비 비율(%)로 비교한다
  const ranked = S.map(s => [s, s[4].reduce((a, w, i) => a + w * v[i], 0) / s[4].reduce((a, w) => a + w * 4, 0) * 100]).sort((a, b) => b[1] - a[1]);
  if (!ranked[0][1]) { document.getElementById('rank').innerHTML = '<p class="muted">막대를 움직여 내 생각을 표시해 보세요.</p>'; return; }
  const top = ranked[0][1];
  document.getElementById('rank').innerHTML = ranked.slice(0, 3).map(([s, sc], i) =>
    `<div class="item"><b class="n">${i + 1}</b><div><b>${s[0]}</b><br><span class="muted">${s[2]} · 확인: ${s[3]}</span></div>
     <div class="meter"><i style="width:${Math.round(sc / top * 100)}%"></i></div></div>`).join('');
}
render();
</script>
</body>
</html>
